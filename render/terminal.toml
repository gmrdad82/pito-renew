app = "pito-renew"
bin = "demo"
grid = [100, 13]
frame = "window"
prompt = "$ "
typing = "35ms"

[build]
command = "cargo build --release --locked --example demo"
bin_dir = "{target}/release/examples"

[env]
HOME = "home"
NO_COLOR = "1"

[theme]
name = "Catppuccin Mocha"
background = "#1e1e2e"
foreground = "#cdd6f4"
selection = "#45475a"
cursor = "#f5e0dc"
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"
brightBlack = "#585b70"
brightRed = "#f38ba8"
brightGreen = "#a6e3a1"
brightYellow = "#f9e2af"
brightBlue = "#89b4fa"
brightMagenta = "#f5c2e7"
brightCyan = "#94e2d5"
brightWhite = "#a6adc8"

[shots.demo]
kind = "clip"
line = "The demo example: an app at 1.0.0 checks a local manifest, installs 1.1.0 once its sha256 matches, then refuses a tampered download and keeps the old binary"
tape = "render/terminal/demo.tape"
launch = "export PATH={bin}:$PATH && clear"
settle = "400ms"
status = "SHIPPED"

[shots.forged]
kind = "clip"
line = "The demo with --forged: the manifest is signed by a key the app doesn't carry, so check refuses it and the app at 1.0.0 stays as it was"
tape = "render/terminal/forged.tape"
launch = "export PATH={bin}:$PATH && clear"
settle = "400ms"
status = "SHIPPED"

[shots.major]
kind = "clip"
line = "The demo with --major: an app at 1.4.2 finds 2.0.0, is told it is a new major version, and installs it once its sha256 matches"
tape = "render/terminal/major.tape"
launch = "export PATH={bin}:$PATH && clear"
settle = "400ms"
status = "SHIPPED"
