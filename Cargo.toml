[package]
name = "renew"
version = "3.1.1"
edition = "2024"
rust-version = "1.97"
description = "Self-update for a Rust app: fetch a release manifest, stream-verify this platform's binary against its sha256, swap it in place and relaunch"
license = "MIT"
repository = "https://github.com/gmrdad82/pito-renew"
homepage = "https://pitomd.com"
publish = false

[dependencies]
sha2 = "0.10.9"
minisign-verify = "=0.3.0"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[dev-dependencies]
minisign = "=0.10.0"
tempfile = "3"
