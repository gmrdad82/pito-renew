name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  docs:
    name: docs bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
      - run: bin/docs-bundle "$GITHUB_REF_NAME"
      - name: Attach the bundle to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '$0 ~ "^## " tag " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > tmp/notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "pito-renew $TAG" --notes-file tmp/notes.md || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "tmp/docs-bundle/docs-$TAG.tar.gz" --clobber
